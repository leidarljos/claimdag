name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  front-ends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: cargo build --release --workspace
      # Both front ends read one directory, and the failure when they disagree
      # about which is silent: each opens a work.bin and neither shows the
      # other's work.
      - name: One graph, both front ends
        env:
          CLAIMDAG_DIR: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          mkdir -p "$CLAIMDAG_DIR"
          bin=target/release
          root=$("$bin/claimdag" upsert --summary "land the adapter")
          "$bin/claimdag" upsert --summary "write the tree" --parent "$root" >/dev/null
          "$bin/claimdag-tui" --dump | tee /dev/stderr | grep -q "  write the tree"
          test "$("$bin/claimdag-tui" --dump | wc -l)" = 2
