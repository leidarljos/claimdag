name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ubuntu-latest alone never ran the suite on the arm64 Linux or macOS
  # hosts the release workflow builds. flock and geteuid come from libc,
  # so these steps run on those hosts too.
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Each manifest's rust-version is the oldest rustc that still checks
  # that crate. The version is read from the manifest, so a binary put
  # back on 1.85 runs `cargo +1.85 check` and fails on the dependency
  # floor. A later dependency that needs a newer rustc fails the same way.
  msrv:
    name: cargo +MSRV check -p CRATE --all-targets
    runs-on: ubuntu-latest
    # Two cold checks, one per declared floor. The rust job's 20 minutes
    # also runs the suite; 30 leaves room for the second toolchain.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rustup is not on the runner. 1.85 is the workspace floor; the
      # next step installs whatever version each manifest declares.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85
      - name: cargo +MSRV check -p CRATE --all-targets
        run: |
          set -euo pipefail

          # Print the rust-version literal. A `workspace = true` line
          # follows [workspace.package] in the root Cargo.toml.
          rust_version() {
            local manifest=$1
            local line ver
            line=$(grep -m 1 -E '^rust-version([[:space:]]|\.)' "$manifest" || true)
            if [[ "$line" == *'.workspace = true'* ]]; then
              line=$(grep -m 1 -E '^rust-version[[:space:]]*=' Cargo.toml || true)
            fi
            ver=$(printf '%s\n' "$line" | sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p')
            if [[ -z "$ver" ]]; then
              echo "could not read rust-version from $manifest" >&2
              return 1
            fi
            printf '%s\n' "$ver"
          }

          installed=" "
          while read -r crate manifest; do
            ver=$(rust_version "$manifest")
            if [[ "$installed" != *" $ver "* ]]; then
              rustup toolchain install "$ver" --profile minimal --no-self-update
              installed+="$ver "
            fi
            echo "cargo +${ver} check -p ${crate} --all-targets"
            cargo +"$ver" check -p "$crate" --all-targets
          done <<'EOF'
          claimdag crates/claimdag/Cargo.toml
          claimdag-cli crates/claimdag-cli/Cargo.toml
          claimdag-mcp crates/claimdag-mcp/Cargo.toml
          claimdag-tui crates/claimdag-tui/Cargo.toml
          EOF

  front-ends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: cargo build --release --workspace
      # Both front ends read one directory, and the failure when they disagree
      # about which is silent: each opens a work.bin and neither shows the
      # other's work.
      - name: One graph, both front ends
        env:
          CLAIMDAG_DIR: ${{ runner.temp }}/work
        run: |
          set -euo pipefail
          mkdir -p "$CLAIMDAG_DIR"
          bin=target/release
          root=$("$bin/claimdag" upsert --summary "land the adapter")
          "$bin/claimdag" upsert --summary "write the tree" --parent "$root" >/dev/null
          "$bin/claimdag-tui" --dump | tee /dev/stderr | grep -q "  write the tree"
          test "$("$bin/claimdag-tui" --dump | wc -l)" = 2

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
