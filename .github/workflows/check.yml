name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The pane drives the command line rather than reimplementing claim and
      # complete, so it needs the binary the way a seat has it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: cargo build --release -p claimdag-cli
      - run: echo "$PWD/target/release" >> "$GITHUB_PATH"
      - run: uv run --with '.[test]' pytest -q tests
