name: docs site

# Builds the Sphinx site and the rustdoc HTML. Nothing here is published:
# the docs workflow keeps the Pages deploy.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: sudo apt-get install -y --no-install-recommends pandoc
      - run: bash docs/scripts/export_org_to_rst.sh
      - run: python -m pip install -q -r docs/requirements.txt
      - run: sphinx-build -b html -n -W docs/source docs/build
      # The claimdag-cli binary shares the library's rustdoc path, so it is
      # left out. The command line is the Sphinx reference page.
      - run: cargo doc --no-deps -p claimdag -p claimdag-tui -p claimdag-mcp --locked
      - run: cp -a target/doc docs/build/rustdoc
