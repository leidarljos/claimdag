[workspace]
resolver = "2"
members = [
    "crates/claimdag",
    "crates/claimdag-cli",
    "crates/claimdag-mcp",
    "crates/claimdag-tui",
]

[workspace.package]
# The only version written by hand. The copies cogfiles.txt lists are cog
# blocks; `cog -r @cogfiles.txt` rewrites them from this line.
version = "0.8.0"
edition = "2021"
# `cargo +1.85 check -p claimdag --all-targets` passes on rustc 1.85.1
# (4eb161250, 2025-03-15). claimdag-mcp and claimdag-tui set their own.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leidarljos/claimdag"
homepage = "https://leidarljos.github.io/claimdag/"
description = "CAS claim and complete on a DAG"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { version = "4", features = ["derive"] }
capnp = "0.27"
memmap2 = "0.9"
# Published path dependency. cog writes the version from [workspace.package].
# [[[cog import claimdag_version as v; cog.out(v.dependency_line()) ]]]
claimdag = { path = "crates/claimdag", version = "0.8.0" }
# [[[end]]]
