[workspace]
resolver = "2"
members = [
    "crates/claimdag",
    "crates/claimdag-cli",
    "crates/claimdag-mcp",
    "crates/claimdag-tui",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/leidarljos/claimdag"
homepage = "https://leidarljos.github.io/claimdag/"
description = "CAS claim and complete on a DAG"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { version = "4", features = ["derive"] }
capnp = "0.20"
memmap2 = "0.9"
claimdag = { path = "crates/claimdag", version = "0.3.0" }
