[package]
name = "claimdag-cli"
version.workspace = true
edition.workspace = true
# `cargo +1.85 check -p claimdag-cli --all-targets` passes on rustc 1.85.1
# (4eb161250, 2025-03-15). Its dependencies do not raise the floor.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "claimdag command line over a work.bin directory"
readme.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/claimdag-v{ version }-{ target }.tar.gz"
bin-dir = "claimdag-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# The release tarball or nothing. A target without one fails here, and
# `cargo install` builds it from source.
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "claimdag"
path = "src/main.rs"

[dependencies]
clap.workspace = true
claimdag.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
