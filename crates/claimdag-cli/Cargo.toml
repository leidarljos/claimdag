[package]
name = "claimdag-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "claimdag command line over a work.bin directory"
readme.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/claimdag-v{ version }-{ target }.tar.gz"
bin-dir = "claimdag-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "claimdag"
path = "src/main.rs"

[dependencies]
clap.workspace = true
claimdag.workspace = true
serde_json.workspace = true
