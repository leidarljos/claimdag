[package]
name = "claimdag-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo +1.87 check -p claimdag-mcp --all-targets` fails: rmcp 3.3.0
# requires rustc 1.88. `cargo +1.88 check -p claimdag-mcp --all-targets`
# passes on rustc 1.88.0 (6b00bc388, 2025-06-23).
rust-version = "1.88"
description = "Model Context Protocol server over a claim graph: what is claimable, who holds what, and the lease on it"
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# The release archive is named after the workspace, not this crate, so point
# cargo-binstall at it; claimdag-mcp ships beside claimdag in that tarball.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/claimdag-v{ version }-{ target }.tar.gz"
bin-dir = "claimdag-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# The release tarball or nothing. A target without one fails here, and
# `cargo install` builds it from source.
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "claimdag-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The workspace pin, which cog writes from [workspace.package].
claimdag.workspace = true
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

[dev-dependencies]
tempfile = "3"
