[package]
name = "claimdag-tui"
version.workspace = true
edition.workspace = true
# `cargo +1.87 check -p claimdag-tui --all-targets` fails: ratatui 0.30.2
# and time 0.3.55 require rustc 1.88. `cargo +1.88 check -p claimdag-tui
# --all-targets` passes on rustc 1.88.0 (6b00bc388, 2025-06-23).
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Terminal work graph over a claimdag work.bin"
readme.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/claimdag-v{ version }-{ target }.tar.gz"
bin-dir = "claimdag-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# The release tarball or nothing. A target without one fails here, and
# `cargo install` builds it from source.
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "claimdag-tui"
path = "src/main.rs"

[lib]
name = "claimdag_tui"
path = "src/lib.rs"

[dependencies]
claimdag.workspace = true
clap.workspace = true
# The pane draws with crossterm. underline-color is a default feature, and
# it is the one that locks the termina and termwiz backends: it names them
# with a weak feature, and Cargo still records the backends in Cargo.lock.
# They are never built. With them come terminfo (WTFPL) and wezterm-bidi
# and finl_unicode (each MIT AND Unicode-DFS-2016). deny.toml allows none
# of those. The other default features stay on.
ratatui = { version = "0.30.2", default-features = false, features = [
    "all-widgets",
    "crossterm",
    "layout-cache",
    "macros",
] }
serde_json.workspace = true
# The seat's actor id is the truncated SHA-256 of user@host, and the ids
# already written into work.bin were minted that way.
sha2 = "0.10"
# gethostname, so the host half of that id is this machine on Linux and
# on macOS. /proc/sys/kernel/hostname exists only on Linux.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
