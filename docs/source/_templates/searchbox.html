{%- if pathto('search') != '#' -%}
<form class="searchbox flex items-center" action="{{ pathto('search') }}" method="get" role="search">
  <label class="ll-sr" for="header-search">Search documentation</label>
  <input id="header-search" type="text" name="q" placeholder="{{ _('Search') }}" />
  <kbd>/</kbd>
</form>
{%- endif -%}
